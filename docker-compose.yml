services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "4173"
    volumes:
      - zhujian-data:/var/data
    networks:
      - zhujian

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - zhujian

networks:
  zhujian:

volumes:
  zhujian-data:
  caddy-data:
  caddy-config:
